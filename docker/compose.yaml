name: rda

services:
    postgres:
        image: pgvector/postgres:16
        container_name: rda-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-rda}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-rda}
        ports:
            - ${POSTGRES_PORT:-5433}:5432
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U  ${POSTGRES_USER:-rda} -d ${POSTGRES_DB:-rda}"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pgdata: